version: 2

updates:
  # Actions are the supply chain most likely to be forgotten and the one that
  # has actually been attacked. Grouped so it stays one pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Dependabot has spoken Bun since 1.1.39, so it updates bun.lock next to
  # package.json and its pull requests survive the frozen lockfile check.
  # Grouped for the same reason as above: three devDependencies are not worth
  # three pull requests. Note that Bun is version updates only — a vulnerable
  # transitive dependency will not raise a pull request of its own.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
