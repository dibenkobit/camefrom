version: 2

updates:
  # Actions are the supply chain most likely to be forgotten and the one that
  # has actually been attacked. Grouped so it stays one pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # No npm entry on purpose. Dependabot updates package.json but leaves
  # bun.lock untouched, so every pull request it opens fails the frozen
  # lockfile check by construction. Three devDependencies are cheaper to bump
  # by hand with `bun update`; Renovate is the answer if that ever stops being
  # true.
